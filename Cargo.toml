[package]
name = "paseo2t3"
version = "0.1.0"
edition = "2021"
description = "Port Paseo agents (and native Claude Code / Codex sessions) into T3 Code as resumable threads"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive", "env"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tungstenite = { version = "0.24", default-features = false, features = ["handshake"] }
ureq = { version = "2", default-features = false, features = ["json"] }
